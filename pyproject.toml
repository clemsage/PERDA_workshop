[project]
name = "perda_hackathon"
requires-python = ">3.12,<3.13"
version = "2026.10.15"

dependencies = [
    "litlogger",
    "perda-loader",
    "torch==2.5.1"
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
perda-loader = { git = "https://github.com/perda-dataset/perda-loader" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
